architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Fabric Loader is used for the @Environment annotations, which Architectury
    // rewrites for each platform. Nothing else from it is used in common code.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API provides the cross platform registry and event helpers.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Alex's Mobs Neo and the real Citadel (NeoForge only, Mojang-mapped), so they
    // are plain compile-only jars rather than remapped mod jars. Alex's Mobs Neo
    // uses the real Citadel instead of a bundled copy, which is what makes this
    // fork run on it. The jars are local, so the build never needs a remote
    // repository for them.
    compileOnly files(rootProject.file('libs/alexsmobs-1.22.9.jar'))
    compileOnly files(rootProject.file('libs/citadel-2.7.1-1.21.1.jar'))
    // Alex's Mobs Neo exposes its registry entries as NeoForge DeferredHolders, so
    // the shared code needs NeoForge's API classes to compile against them.
    compileOnly "net.neoforged:neoforge:$rootProject.neoforge_version:universal"

    // Farmer's Delight: the Fabric build is used for common compilation; both
    // platforms expose the same class and field names.
    modCompileOnly files(rootProject.file('libs/FarmersDelight-1.21.1-3.3.6+refabricated.jar'))

    // JEI is an optional integration: only the Fabric build is needed here to
    // compile the plugin, which JEI discovers on its own at runtime.
    modCompileOnly files(rootProject.file('libs/jei-1.21.1-fabric-19.56.0.439.jar'))

    // Jade is an optional integration as well: the shared plugin compiles against
    // the Fabric build and is loaded by Jade on Fabric (entrypoint) and on
    // NeoForge (@WailaPlugin annotation).
    modCompileOnly files(rootProject.file('libs/Jade-1.21.1-Fabric-15.10.6.jar'))
}
